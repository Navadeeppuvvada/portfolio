]<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Navadeep Puvvada — Portfolio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>  :root{    --bg: #0A0A0F;    --surface: #131319;    --surface2: #191922;    --text: #F2F1F6;    --muted: #8D8BA3;    --accent: #8B6CFF;    --accent2: #00E5C4;    --line: #26262F;  }  *{margin:0;padding:0;box-sizing:border-box;}  html{scroll-behavior:smooth;}  body{    background:var(--bg);    color:var(--text);    font-family:'Inter',sans-serif;    line-height:1.65;    -webkit-font-smoothing:antialiased;    overflow-x:hidden;  }  h1,h2,h3{font-family:'Sora',sans-serif; font-weight:700; letter-spacing:-0.01em;}  a{color:inherit; text-decoration:none;}  .wrap{max-width:1040px; margin:0 auto; padding:0 32px; position:relative; z-index:2;}  ::selection{background:var(--accent); color:#0A0A0F;}   /* progress bar */  #progress{    position:fixed; top:0; left:0; height:3px; width:0%;    background:linear-gradient(90deg,var(--accent),var(--accent2));    z-index:100; transition:width .1s linear;  }
